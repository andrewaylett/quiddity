name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      with:
        persist-credentials: false
    - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
      with:
        toolchain: stable
        components: rustfmt, clippy
    - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
    - run: cargo fmt --all --check
    - run: cargo clippy --all-targets --locked
    - uses: taiki-e/install-action@5488ac5a951645ce95062214902ac4b6bc1a1037 # v2
      with:
        tool: cargo-nextest
    - run: cargo nextest run --locked --profile ci
    - run: cargo test --doc --locked
    - run: cargo doc --no-deps --locked
      env:
        RUSTDOCFLAGS: -D warnings

  ui:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      with:
        persist-credentials: false
    - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
    - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
      with:
        node-version: 22
        cache: pnpm
    # The UI embeds the graph replica, which is the core compiled to WASM. The
    # CLI's version must match the wasm-bindgen crate's, which is pinned.
    - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
      with:
        toolchain: stable
        targets: wasm32-unknown-unknown
    - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
    - uses: taiki-e/install-action@5488ac5a951645ce95062214902ac4b6bc1a1037 # v2
      with:
        tool: wasm-bindgen@0.2.129
    - run: pnpm install --frozen-lockfile
    - run: pnpm ui typecheck
    - run: pnpm ui build

  app:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      with:
        persist-credentials: false
    - run: >-
        sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev libayatana-appindicator3-dev
    - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
    - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
      with:
        node-version: 22
        cache: pnpm
    - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
      with:
        toolchain: stable
        components: rustfmt, clippy
        targets: wasm32-unknown-unknown
    - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
      with:
        workspaces: |
          .
          apps/app/src-tauri
    - uses: taiki-e/install-action@5488ac5a951645ce95062214902ac4b6bc1a1037 # v2
      with:
        tool: wasm-bindgen@0.2.129
    - run: pnpm install --frozen-lockfile
    # The shell embeds the built UI.
    - run: pnpm ui build
    - working-directory: apps/app/src-tauri
      run: |
        cargo fmt --check
        cargo clippy --all-targets --locked
        cargo test --locked

  mutants:
    # Every mutant in the lines a PR changes must be caught by some test.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      with:
        fetch-depth: 0
        persist-credentials: false
    - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
      with:
        toolchain: stable
    - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
    - uses: taiki-e/install-action@5488ac5a951645ce95062214902ac4b6bc1a1037 # v2
      with:
        tool: cargo-nextest,cargo-mutants
    - run: git diff "origin/${GITHUB_BASE_REF}..." > pr.diff
    - run: cargo mutants --in-diff pr.diff --no-shuffle -j 2 --timeout-multiplier 3
      env:
        PROPTEST_CASES: 64
    - if: always()
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
      with:
        name: mutants
        path: mutants.out/

  fuzz:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target: [block, outline, peer]
    steps:
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      with:
        persist-credentials: false
    - uses: dtolnay/rust-toolchain@2c76c034f9e32a5d6e2c104dc4df23a22476db04 # nightly
      with:
        toolchain: nightly
    - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
      with:
        workspaces: fuzz
    - uses: taiki-e/install-action@5488ac5a951645ce95062214902ac4b6bc1a1037 # v2
      with:
        tool: cargo-fuzz
    # The prebuilt cargo-fuzz otherwise targets musl, which isn't installed.
    - run: mkdir -p fuzz/corpus/${{ matrix.target }}
    - run: >-
        cargo fuzz run --target x86_64-unknown-linux-gnu ${{ matrix.target }} fuzz/corpus/${{ matrix.target }} fuzz/seeds/${{ matrix.target }} -- -max_total_time=60
    - if: failure()
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
      with:
        name: fuzz-${{ matrix.target }}
        path: fuzz/artifacts/
