name: Set up the toolchain
description: Installs a job's tools from mise.toml and routes cargo through mr boxington, so its builds are cached.

inputs:
  tools:
    description: The mise tools to install; the rest of mise.toml is left alone.
    required: true
  node:
    description: Whether the job needs Node and pnpm ("true" or "false").
    default: "false"
  cargo-workspace:
    description: The Cargo workspace whose target directory the cache keeps.
    default: .

runs:
  using: composite
  steps:
  # Before mise, as the version comes from the file mise reads. Caching is
  # left to the pnpm store step below, since pnpm isn't installed yet.
  - if: inputs.node == 'true'
    uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
    with:
      node-version-file: mise.toml
      package-manager-cache: false
  - uses: jdx/mise-action@6be3c7ed4c21d4f76b208d351d95aac273ebb76d # v5.2.4
    with:
      install_args: ${{ inputs.tools }}
  - if: inputs.node == 'true'
    id: pnpm
    shell: bash
    run: echo "store=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"
  - if: inputs.node == 'true'
    uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
    with:
      path: ${{ steps.pnpm.outputs.store }}
      key: pnpm-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
      restore-keys: pnpm-${{ runner.os }}-
  # The toolchain must already be on PATH: the cache key includes rustc's.
  - uses: jdx/mr-boxington-action@88acf2bb50552c7c508cbac13e5f8c576b95b1de # v1.7.3
    with:
      working-directory: ${{ inputs.cargo-workspace }}
  # mbx's cargo shim sits first on PATH, so plain `cargo` (including the
  # calls scripts, cargo-mutants and cargo-fuzz make) goes through mbx too.
  # The directory is built from runner-set variables only, never from input.
  - shell: bash
    run: | # zizmor: ignore[github-env]
      mbx setup
      echo "${XDG_DATA_HOME:-$HOME/.local/share}/mbx/bin" >> "$GITHUB_PATH"
  - shell: bash
    run: |
      shim="${XDG_DATA_HOME:-$HOME/.local/share}/mbx/bin/cargo"
      test "$(command -v cargo)" = "$shim" || { echo "cargo is $(command -v cargo), not mbx's shim" >&2; exit 1; }
      cargo --version
