[package]
name = "quiddity-wasm"
description = "A Quiddity graph replica for the browser, compiled to WASM"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
console_error_panic_hook = "0.1"
jiff.workspace = true
quiddity-core.workspace = true
quiddity-view = { path = "../view" }
serde = "1"
serde-wasm-bindgen = "0.6"
wasm-bindgen = "=0.2.130"

# The core makes block ids with uuid, which needs a source of randomness
# where there is no operating system.
[target.'cfg(target_arch = "wasm32")'.dependencies]
uuid = { version = "1", features = ["js"] }

[lints]
workspace = true
